<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="만동이">
<meta name="theme-color" content="#1f5f8b">
<title>만동이 Get Give Take</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column, a verb tab bar on top, a single big card in the middle, controls below. */
:root{
  --bg:#f6f4ee; --paper:#fffdf8; --ink:#1d1b16; --muted:#6d685c; --line:#dcd7c9;
  --accent:#1f5f8b; --accent-ink:#ffffff; --good:#2e7d4f; --bad:#b4442c; --soft:#eef2f5;
  --display:"Fraunces", Georgia, serif;
  --body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --paper:#1e2126; --ink:#ecebe6; --muted:#a19d93; --line:#343842;
    --accent:#6fb3e0; --accent-ink:#0f1a24; --good:#6cc48e; --bad:#ec8a6f; --soft:#262b33; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171b; --paper:#1e2126; --ink:#ecebe6; --muted:#a19d93; --line:#343842;
  --accent:#6fb3e0; --accent-ink:#0f1a24; --good:#6cc48e; --bad:#ec8a6f; --soft:#262b33; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:1.5rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.85rem}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 1rem var(--display);padding:10px 0;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;font:500 .9rem var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px 22px;min-height:260px;
  display:flex;flex-direction:column;gap:14px;justify-content:center;text-align:center;position:relative}
.num{position:absolute;top:14px;left:18px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.verb{position:absolute;top:12px;right:18px;font:600 .8rem var(--display);color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.big{font-family:var(--display);font-size:clamp(1.4rem,5vw,2rem);line-height:1.25;margin:0;text-wrap:balance;word-break:keep-all;white-space:pre-line}
.big.en{letter-spacing:-.01em}
.answer{margin:0;font-size:1.05rem;color:var(--ink);word-break:keep-all}
.answer .alt{display:block;color:var(--muted);font-size:.9rem;margin-top:4px}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.input{display:flex;gap:8px}
.input input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:1rem var(--body)}
.input input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:11px 16px;font:500 .95rem var(--body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.result{font-weight:600;margin:0}
.result.ok{color:var(--good)} .result.no{color:var(--bad)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}
.summary{display:flex;flex-direction:column;gap:14px;align-items:center}
.sumBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#score b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap" id="lock" hidden>
  <header><h1>만동이 패턴 연습</h1></header>
  <form class="input" id="lockForm">
    <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="비밀번호" aria-label="비밀번호">
    <button class="btn primary" type="submit">열기</button>
  </form>
  <p class="hint" id="lockMsg" role="status"></p>
</div>
<noscript><p class="hint" style="padding:16px">이 뷰어에서는 내용이 표시되지 않습니다. Chrome이나 Safari 같은 브라우저로 열어 주세요.</p></noscript>
<div class="wrap" id="app" hidden>
  <header>
    <h1>만동이 패턴 연습</h1>
    <span class="sub" id="count"></span>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="get" aria-selected="true">Get</button>
    <button role="tab" data-v="give" aria-selected="false">Give</button>
    <button role="tab" data-v="take" aria-selected="false">Take</button>
  </div>

  <div class="bar">
    <div class="seg" id="modes">
      <button data-m="study" aria-pressed="true">학습</button>
      <button data-m="quiz" aria-pressed="false">퀴즈</button>
    </div>
    <div class="seg" id="dirs">
      <button data-d="en" aria-pressed="true">영어 보기</button>
      <button data-d="ko" aria-pressed="false">한글 보기</button>
    </div>
    <label class="toggle"><input type="checkbox" id="shuffle"> 순서 섞기</label>
    <label class="toggle"><input type="checkbox" id="lead"> 앞 패턴 붙이기</label>
  </div>

  <div class="progress"><i id="prog"></i></div>

  <section class="card" id="card">
    <span class="num" id="num"></span>
    <span class="verb" id="verbTag"></span>
    <noscript><p class="answer">이 뷰어에서는 내용이 표시되지 않습니다. 파일을 Chrome이나 Safari 같은 브라우저로 열어 주세요.</p></noscript>
    <p class="big" id="prompt"></p>
    <p class="answer" id="answer" hidden></p>
    <p class="result" id="result" hidden></p>
    <p class="hint" id="hint"></p>
    <div class="summary" id="summary" hidden>
      <p class="big">퀴즈 끝</p>
      <p class="answer" id="score"></p>
      <div class="sumBtns">
        <button class="btn primary" id="retryWrong">오답만 다시</button>
        <button class="btn" id="restart">처음부터</button>
      </div>
    </div>
  </section>

  <form class="input" id="form" hidden>
    <input id="guess" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어 패턴을 입력하세요">
    <button class="btn primary" type="submit">확인</button>
  </form>

  <div class="nav">
    <button class="btn" id="prev">이전</button>
    <button class="btn primary" id="reveal">정답 보기</button>
    <button class="btn" id="next">다음</button>
  </div>

</div>

const enc = u => btoa(String.fromCharCode.apply(null, u));
const KEY = "mandong-key";
async function derive(pw){
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:dec(P.salt), iterations:P.it, hash:"SHA-256"}, m, 256));
}
async function unlock(raw){
  const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:dec(P.iv)}, k, dec(P.ct)));
}
function run(code){
  el("lock").hidden = true; el("app").hidden = false;
  const s = document.createElement("script"); s.textContent = code; document.body.appendChild(s);
}
function ask(msg){ el("lock").hidden = false; el("lockMsg").textContent = msg || ""; el("pw").focus(); }
el("lockForm").addEventListener("submit", async e => {
  e.preventDefault();

    const raw = await derive(pw); const code = await unlock(raw);

});
